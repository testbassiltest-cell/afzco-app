  <div class="container">
    <h2>Employees</h2>
    <div class="card">
      <h3>Add Employee</h3>
      <form id="employeeForm" class="grid-3">
        <div>
          <label>Name</label><input type="text" id="empName" required>
          <label>Employee ID</label><input type="text" id="empId" required>
          <label>Email</label><input type="email" id="empEmail" placeholder="user@example.com">
        </div>
        <div>
          <label>Department</label><input type="text" id="empDept">
          <label>Position</label><input type="text" id="empPosition">
          <label>Role</label>
          <select id="empRole"></select>
        </div>
        <div>
          <button type="submit" class="mt">Add Employee</button>
        </div>
      </form>
    </div>
    <!-- Table controls: search/filter and export to CSV -->
    <div class="table-controls">
      <input type="text" id="searchEmployees" placeholder="Search employees…">
      <button id="exportEmployees">Export CSV</button>
    </div>
    <h3>Employee List</h3>
    <table id="employeeTable">
      <tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Position</th><th>Role</th><th>Manage</th><th>Delete</th></tr>
    </table>
  </div>
