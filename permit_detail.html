<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Permit Detail</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="navbar">
    <a href="permits.html">Back to Permits</a>
    <a href="actions.html">Action Management</a>
    <a href="audit_logs.html" id="navLogs">Audit Logs</a>
    <a href="settings.html" id="navSettings">Settings</a>
    <span id="navUser" class="nav-user"></span>
    <a href="#" id="navLogout">Logout</a>
  </div>
  <div class="container">
    <h2>Permit Detail</h2>
    <div id="permitHeader" class="card"></div>

    <div class="tabs">
      <button class="tablink" onclick="openTab(event,'pt_overview')">Overview</button>
      <button class="tablink" onclick="openTab(event,'pt_actions')">Actions</button>
      <button class="tablink" onclick="openTab(event,'pt_history')">History</button>
    </div>

    <div id="pt_overview" class="tabcontent">
      <div id="permitOverview"></div>
      <h3>Update Status</h3>
      <form id="permitStatusForm" class="card">
        <label>Status</label>
        <select id="permitStatus">
          <option>Requested</option>
          <option>Approved</option>
          <option>In Progress</option>
          <option>Closed</option>
        </select>
        <button type="button" onclick="savePermitStatus()">Save Status</button>
      </form>
    </div>

    <div id="pt_actions" class="tabcontent">
      <h3>Add Action</h3>
      <form id="permitActionForm" class="grid-3 card">
        <div>
          <label>Title</label><input type="text" id="paTitle" required>
          <label>Owner</label><input type="text" id="paOwner">
        </div>
        <div>
          <label>Department</label><input type="text" id="paDept">
          <label>Due Date</label><input type="date" id="paDue">
        </div>
        <div>
          <button type="submit" class="mt">Add Action</button>
        </div>
      </form>
      <h3>Actions List</h3>
      <ul id="permitActionList" class="list"></ul>
    </div>

    <div id="pt_history" class="tabcontent">
      <h3>History</h3>
      <ul id="permitHistory" class="list"></ul>
    </div>
  </div>
</body>
</html>
