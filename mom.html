  <div class="container">
    <h2>Minutes of Meeting (MOM)</h2>
    <form id="momForm" class="grid-3 card">
      <div>
        <label>Meeting No.</label><input type="text" id="momNo" placeholder="Auto if blank">
        <label>Date/Time</label><input type="datetime-local" id="momDT">
      </div>
      <div>
        <label>Organizer</label><input type="text" id="momOrg">
        <label>Attendees</label><input type="text" id="momAtt" placeholder="Comma-separated">
      </div>
      <div>
        <label>Agenda</label><textarea id="momAgenda" rows="3"></textarea>
        <label>Decisions</label><textarea id="momDec" rows="3"></textarea>
        <label>Next Review Date</label><input type="date" id="momNext">
        <button type="submit" class="mt">Create MOM</button>
      </div>
    </form>

    <!-- Table controls: search/filter and export to CSV -->
    <div class="table-controls">
      <input type="text" id="searchMom" placeholder="Search meetings…">
      <button id="exportMom">Export CSV</button>
    </div>
    <h3>MOM List</h3>
    <table id="momTable">
      <tr><th>Mtg #</th><th>Date</th><th>Organizer</th><th>Attendees</th><th>Manage</th><th>Delete</th></tr>
    </table>
  </div>
</body>
