<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Safety Issue Detail</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="navbar">
    <a href="safety.html">Back to Safety Issues</a>
    <a href="actions.html">Action Management</a>
    <a href="audit_logs.html" id="navLogs">Audit Logs</a>
    <a href="settings.html" id="navSettings">Settings</a>
    <span id="navUser" class="nav-user"></span>
    <a href="#" id="navLogout">Logout</a>
  </div>
  <div class="container">
    <h2>Safety Issue Detail</h2>
    <div id="safetyHeader" class="card"></div>
    <div class="tabs">
      <button class="tablink" onclick="openTab(event,'si_overview')">Overview</button>
      <button class="tablink" onclick="openTab(event,'si_investigation')">Investigation</button>
      <button class="tablink" onclick="openTab(event,'si_actions')">Actions</button>
      <button class="tablink" onclick="openTab(event,'si_history')">History</button>
    </div>
    <div id="si_overview" class="tabcontent">
      <div id="safetyOverview"></div>
      <!-- container to display uploaded images -->
      <div id="safetyImagesView" class="image-grid mt"></div>
      <h3>Update Status</h3>
      <form id="safetyStatusForm" class="card">
        <label>Status</label>
        <select id="safetyStatus">
          <option>New</option>
          <option>Investigating</option>
          <option>Actioning</option>
          <option>Closed</option>
        </select>
        <button type="button" onclick="saveSafetyStatus()">Save Status</button>
      </form>
    </div>

    <!-- Investigation tab for root cause analysis -->
    <div id="si_investigation" class="tabcontent">
      <h3>Root Cause Analysis</h3>
      <form id="safetyInvestigationForm" class="card">
        <label>5 Whys (one per line)</label>
        <textarea id="safetyWhys" rows="5" placeholder="1. Why?\n2. Why?\n3. Why?\n4. Why?\n5. Why?"></textarea>
        <label>Root Cause</label>
        <input type="text" id="safetyRootCause">
        <label>Contributing Causes</label>
        <input type="text" id="safetyContribCauses">
        <label>Verification of Cause</label>
        <input type="text" id="safetyVerifyCause">
        <button type="button" onclick="saveSafetyInvestigation()">Save Investigation</button>
      </form>
    </div>
    <div id="si_actions" class="tabcontent">
      <h3>Add Action</h3>
      <form id="safetyActionForm" class="grid-3 card">
        <div>
          <label>Title</label><input type="text" id="siTitle" required>
          <label>Owner</label><input type="text" id="siOwner">
        </div>
        <div>
          <label>Department</label><input type="text" id="siDept">
          <label>Due Date</label><input type="date" id="siDue">
        </div>
        <div>
          <button type="submit" class="mt">Add Action</button>
        </div>
      </form>
      <h3>Actions List</h3>
      <ul id="safetyActionList" class="list"></ul>
    </div>
    <div id="si_history" class="tabcontent">
      <h3>History</h3>
      <ul id="safetyHistory" class="list"></ul>
    </div>
  </div>
</body>
</html>
