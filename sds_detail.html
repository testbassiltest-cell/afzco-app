<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SDS Detail</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="navbar">
    <a href="sds.html">Back to SDS</a>
    <a href="actions.html">Action Management</a>
    <a href="audit_logs.html" id="navLogs">Audit Logs</a>
    <a href="settings.html" id="navSettings">Settings</a>
    <span id="navUser" class="nav-user"></span>
    <a href="#" id="navLogout">Logout</a>
  </div>
  <div class="container">
    <h2>SDS Detail</h2>
    <div id="sdsHeader" class="card"></div>
    <div class="tabs">
      <button class="tablink" onclick="openTab(event,'sds_overview')">Overview</button>
      <button class="tablink" onclick="openTab(event,'sds_actions')">Actions</button>
      <button class="tablink" onclick="openTab(event,'sds_history')">History</button>
    </div>
    <div id="sds_overview" class="tabcontent">
      <div id="sdsOverview"></div>
      <!-- link to view/download uploaded SDS file -->
      <div id="sdsFileLink" class="mt"></div>
      <h3>Update Status</h3>
      <form id="sdsStatusForm" class="card">
        <label>Status</label>
        <select id="sdsStatus">
          <option>Valid</option>
          <option>Pending Revision</option>
          <option>Expired</option>
        </select>
        <button type="button" onclick="saveSdsStatus()">Save Status</button>
      </form>
    </div>
    <div id="sds_actions" class="tabcontent">
      <h3>Add Action</h3>
      <form id="sdsActionForm" class="grid-3 card">
        <div>
          <label>Title</label><input type="text" id="sdsActTitle" required>
          <label>Owner</label><input type="text" id="sdsActOwner">
        </div>
        <div>
          <label>Department</label><input type="text" id="sdsActDept">
          <label>Due Date</label><input type="date" id="sdsActDue">
        </div>
        <div>
          <button type="submit" class="mt">Add Action</button>
        </div>
      </form>
      <h3>Actions List</h3>
      <ul id="sdsActionList" class="list"></ul>
    </div>
    <div id="sds_history" class="tabcontent">
      <h3>History</h3>
      <ul id="sdsHistory" class="list"></ul>
    </div>
  </div>
</body>
</html>
