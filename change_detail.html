<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Request Detail</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="navbar">
    <a href="change.html">Back to Change Requests</a>
    <a href="actions.html">Action Management</a>
    <a href="audit_logs.html" id="navLogs">Audit Logs</a>
    <a href="settings.html" id="navSettings">Settings</a>
    <span id="navUser" class="nav-user"></span>
    <a href="#" id="navLogout">Logout</a>
  </div>
  <div class="container">
    <h2>Change Request Detail</h2>
    <div id="changeHeader" class="card"></div>
    <div class="tabs">
      <button class="tablink" onclick="openTab(event,'chg_overview')">Overview</button>
      <button class="tablink" onclick="openTab(event,'chg_actions')">Actions</button>
      <button class="tablink" onclick="openTab(event,'chg_history')">History</button>
    </div>
    <div id="chg_overview" class="tabcontent">
      <div id="changeOverview"></div>
      <!-- Attachments list for downloaded files -->
      <div id="changeFilesList" class="mt"></div>
      <h3>Update Status</h3>
      <form id="changeStatusForm" class="card">
        <label>Status</label>
        <select id="changeStatus">
          <option>Requested</option>
          <option>Under Review</option>
          <option>Approved</option>
          <option>Implemented</option>
          <option>Rejected</option>
        </select>
        <button type="button" onclick="saveChangeStatus()">Save Status</button>
      </form>
    </div>
    <div id="chg_actions" class="tabcontent">
      <h3>Add Action</h3>
      <form id="changeActionForm" class="grid-3 card">
        <div>
          <label>Title</label><input type="text" id="chgActionTitle" required>
          <label>Owner</label><input type="text" id="chgActionOwner">
        </div>
        <div>
          <label>Department</label><input type="text" id="chgActionDept">
          <label>Due Date</label><input type="date" id="chgActionDue">
        </div>
        <div>
          <button type="submit" class="mt">Add Action</button>
        </div>
      </form>
      <h3>Actions List</h3>
      <ul id="changeActionList" class="list"></ul>
    </div>
    <div id="chg_history" class="tabcontent">
      <h3>History</h3>
      <ul id="changeHistory" class="list"></ul>
    </div>
  </div>
</body>
</html>
